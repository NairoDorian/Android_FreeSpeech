[package]
name = "android_transcribe_app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
cpal = "0.15"
log = "0.4"
android_logger = "0.13"
anyhow = "1.0"
transcribe-cpp = { git = "https://github.com/NairoDorian/transcribe.cpp", branch = "main", default-features = false, features = ["minimal-multilingual"] }
jni = "0.21"
ndk-context = "=0.1.1"
libc = "0.2"
once_cell = "1.19"
crossbeam-channel = "0.5"
